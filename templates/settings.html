<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .settings-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
      width: 90%;
      max-width: 500px;
    }
    h2 { color: #00d4ff; margin-bottom: 20px; }
    label { display: block; margin: 10px 0 5px; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #00d4ff;
      background: #203a43;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00d4ff;
      border: none;
      border-radius: 5px;
      color: #0f2027;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00b3cc; }
    a { color: #00d4ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="settings-box">
    <h2>Settings</h2>
    <form action="/settings" method="post">
      <label for="vibration_threshold">Vibration Level Alert Threshold</label>
      <input type="number" step="0.1" name="vibration_threshold" value="{{ settings.alert_thresholds.VibrationLevel }}" required>
      <button type="submit">Save</button>
    </form>
    <p><a href="/">Back to Dashboard</a></p>
  </div>
</body>
</html>
